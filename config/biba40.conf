# Biba40 config (ZMK 0.2.0)

# Core features
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_BT_CTLR_PHY_2M=n

# Mouse / Pointing support
CONFIG_ZMK_POINTING=y

# Sleep settings
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Logging (errors/warnings only)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
